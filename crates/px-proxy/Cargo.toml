[package]
name = "px-proxy"
version = "0.1.0"
edition = "2024"

[dependencies]
bytes = "1.12.1"
flate2 = "1.1.10"
httparse = "1.10.1"
parking_lot = "0.12.5"
px-store = { version = "0.1.0", path = "../px-store" }
rcgen = { version = "0.14.10", default-features = false, features = ["ring", "pem", "x509-parser"] }
regex = "1.13.1"
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std", "tls12", "logging"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.21"
time = "0.3.55"
tokio = { version = "1.53.2", features = ["full"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12", "logging"] }
tracing = "0.1.44"

[dev-dependencies]
tempfile = "3.27.0"
