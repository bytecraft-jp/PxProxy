[package]
name = "px-store"
version = "0.1.0"
edition = "2024"

[dependencies]
blake3 = "1.8.7"
crossbeam-channel = "0.5.17"
rusqlite = { version = "0.40.2", features = ["bundled", "functions"] }
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.21"
toml = "1.1.6"
tracing = "0.1.44"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
zstd = "0.14.0"

[dev-dependencies]
tempfile = "3.27.0"
